apiVersion: v1
kind: Pod
metadata:
  name: microservicio-gateway
  labels:
    app: microservicio-gateway
spec:
  containers:
    - name: microservicio-gateway
      image: wilmer994/servicios.api.gateway:latest
      imagePullPolicy: Always
      ports:
        - name: http
          containerPort: 80
          protocol: TCP
      env:
        - name: ASPNETCORE_URLS
          value: http://+:80
