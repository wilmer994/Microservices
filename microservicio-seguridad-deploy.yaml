apiVersion: apps/v1
kind: Deployment
metadata:
  name: microservicio-seguridad-deploy
  labels:
    name: microservicio-seguridad-deploy
    app: microservice
spec:
  replicas: 2
  selector:
    matchLabels:
      app: microservicio-seguridad
      type: microservice
  template:
    metadata:
      name: microservicio-seguridad-pod
      labels:
        app: microservicio-seguridad
        type: microservice
    spec:
      containers:
        - name: microservicio-seguridad-app
          image: wilmer994/serviciosapiseguridad:latest
          ports:
            - containerPort: 80
          env:
          - name: MongoDb__ConnectionString
            value: mongodb://wilmer994:P4$$w0rd@mongo-service:27017

