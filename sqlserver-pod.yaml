apiVersion: v1
kind: Pod
metadata:
  name: sqlserver-pod
  labels:
    app: microservicio-seguridad
    name: mssql-pod
spec:
  containers:
    - name: mssql
      image: mcr.microsoft.com/mssql/server
      ports:
      - containerPort : 1433
      env: 
      - name: ACCEPT_EULA
        value: "Y"
      - name: SA_PASSWORD
        value: "P4$$l3cf1r3"

