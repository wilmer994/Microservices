apiVersion: v1
kind: Pod
metadata:
  name: microservicio-libreria
  labels:
    app: microservicio-libreria
spec:
  containers:
    - name: microservicio-libreria
      image: wilmer994/servicios.api.libreria:latest
      imagePullPolicy: Always
      ports:
        - name: http
          containerPort: 80
          protocol: TCP
      env:
        - name: ASPNETCORE_URLS
          value: http://+:80
        - name: MongoDb__ConnectionString
          value: mongodb://mongo:27017
        - name: MongoDb__Database
          value: LibreriaMongoDB
