apiVersion: v1
kind: Pod
metadata:
  name: microservicio-seguridad
  labels:
    app: microservicio-seguridad
spec:
  containers:
    - name: microservicio-seguridad
      image: wilmer994/servicios.api.seguridad:latest
      imagePullPolicy: Always
      ports:
        - name: http
          containerPort: 80
          protocol: TCP
      env:
        - name: ASPNETCORE_URLS
          value: http://+:80
